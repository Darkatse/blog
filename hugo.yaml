baseurl: "https://darkatse.com/"
locale: "en-US"
title: "Darkatse"
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
footnotereturnlinkcontents: "↩"

outputs:
  home: [html, rss, json]

menu:
  main:
    - name: Github
      url: "https://github.com/Darkatse/blog"
      weight: 10
      params:
        class: [optional]

params:
  description: "Darkatse's blog."
  logo:
    en:
      alt: Darkatse
      img: # a path to the logo
  footer: "[Darkatse](https://github.com/Darkatse) · [Hugo Paged](https://github.com/yihui/hugo-paged) by [Yihui Xie](https://yihui.org)"

security:
  allowContent: ['.*']

markup:
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true
